name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Neither dataset may be redistributed: the notebooks run on synthetic stand-ins with known answers
      KKBOX_SYNTHETIC: "1"
      TELECOM_SYNTHETIC: "1"
      TELECOM_PERMUTATIONS: "100"
      KKBOX_BOOT: "100"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff==0.6.9
      - name: Lint
        run: ruff check src tests scripts app notebooks/*.py
      - name: Tests (methods on known answers, reported numbers, both apps)
        run: pytest -q
      - name: Notebooks match their .py sources
        run: python scripts/build_notebooks.py --check
      - name: Run every notebook on the stand-ins
        run: |
          for nb in notebooks/0*.py; do echo "== $nb"; python "$nb" > /dev/null; done
